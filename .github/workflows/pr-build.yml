name: Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libglfw3-dev \
            xorg-dev \
            gcc-mingw-w64-x86-64

      - name: Set up environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Build Linux
        run: |
          CGO_ENABLED=1 go build -ldflags "-X main.Version=pr-${{ github.event.pull_request.number }}" -o ac-tts-linux-amd64 main.go

      - name: Build Windows
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags "-X main.Version=pr-${{ github.event.pull_request.number }}" -o ac-tts-windows-amd64.exe main.go

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ac-tts-linux-amd64
          path: ac-tts-linux-amd64

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: ac-tts-windows-amd64
          path: ac-tts-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Build macOS ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.goarch }} go build -ldflags "-X main.Version=pr-${{ github.event.pull_request.number }}" -o ac-tts-darwin-${{ matrix.goarch }} main.go

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: ac-tts-darwin-${{ matrix.goarch }}
          path: ac-tts-darwin-${{ matrix.goarch }}